name: visual_reference_ppo
seed: 42

observation:
  region: full_ui
  color: rgb
  height: 128
  width: 96
  frame_stack: 4

actions:
  gravity_ticks_per_step: 1
  allow_hold: true
  macro_actions: false

model:
  architecture: small_cnn
  feature_dim: 512

algorithm:
  kind: ppo
  learning_rate: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  rollout_steps: 128
  update_epochs: 4
  minibatch_size: 64
  max_gradient_norm: 0.5

reward:
  kind: sparse_lines
  terminal_penalty: 0.0

training:
  environment_steps: 1000000
  checkpoint_interval: 50000
  output_directory: experiments/training
  device: cpu

evaluation:
  episodes: 100
  first_seed: 10000
  max_steps_per_episode: 10000
  output_directory: experiments/evaluation
