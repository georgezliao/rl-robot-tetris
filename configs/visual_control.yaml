extends: base.yaml
name: visual_control
environment:
  backend: javafx_bridge
  action_mode: control
  observation_mode: rendered_rgb
  observation_height: 128
  observation_width: 96
  frame_stack: 4
  gravity_ticks_per_step: 1
agent:
  kind: dqn_cnn
  learning_rate: 0.0001
  gamma: 0.99
reward:
  kind: sparse
  line_clear: [0, 1, 3, 5, 8]
  game_over: -1
